name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.2.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  SIDECAR_DIR: src-tauri/binaries

jobs:
  # ── tag ──────────────────────────────────────────────────────────────────

  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ inputs.version }}" -m "Release v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

  # ── build matrix ─────────────────────────────────────────────────────────

  build:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ''
            bundles: deb,appimage,rpm
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
            bundles: nsis
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ''
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "v${{ inputs.version }}"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # ── Bump version ──────────────────────────────────────────────────
      - name: Set version in tauri.conf.json
        shell: bash
        run: |
          # Strip optional 'v' prefix — MSI requires strict X.Y.Z format
          V="${{ inputs.version }}"
          V="${V#v}"
          echo "Using version: $V"
          jq ".version = \"$V\"" \
            src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json

      # ── Platform sidecars ─────────────────────────────────────────────
      - name: Download sidecars (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p "$SIDECAR_DIR"

          # yt-dlp — bundle just the Python source, not a full Python runtime.
          # At runtime the wrapper checks the host's PATH first; if yt-dlp
          # is already installed, that version is used. If not, the bundled
          # source runs via the host's system python3.
          PYTHON_PKG_DIR="$SIDECAR_DIR/ytdlp-python"
          mkdir -p "$PYTHON_PKG_DIR"
          pip3 install --target "$PYTHON_PKG_DIR" yt-dlp
          # Wrapper: try system yt-dlp first, fall back to bundled source
          printf '%s\n' \
            '#!/bin/sh' \
            '# Prefer the host yt-dlp if installed' \
            'if command -v yt-dlp 2>&1 >/dev/null; then' \
            '  exec yt-dlp "$@"' \
            'fi' \
            '# Fall back to bundled yt-dlp via the host python3' \
            'DIR="$(dirname "$0")"' \
            'export PYTHONPATH="$DIR/ytdlp-python${PYTHONPATH:+:$PYTHONPATH}"' \
            'if command -v python3 2>&1 >/dev/null; then' \
            '  exec python3 -m yt_dlp "$@"' \
            'else' \
            '  echo "yt-dlp: not found on PATH, and python3 is not installed." >&2' \
            '  echo "Install: pip3 install yt-dlp" >&2' \
            '  exit 1' \
            'fi' \
            > "$SIDECAR_DIR/yt-dlp"
          chmod +x "$SIDECAR_DIR/yt-dlp"
          # Add bundled source to PYTHONPATH
          echo "$PYTHON_PKG_DIR" > "$SIDECAR_DIR/ytdlp-python.pth"

          # GStreamer plugins — linuxdeploy doesn't bundle these automatically,
          # but WebKit's <video> element needs them. Copy from CI machine.
          GST_PLUGIN_DIR="$SIDECAR_DIR/gst-plugins"
          mkdir -p "$GST_PLUGIN_DIR"
          if [ -d /usr/lib/x86_64-linux-gnu/gstreamer-1.0 ]; then
            cp -rL /usr/lib/x86_64-linux-gnu/gstreamer-1.0/* "$GST_PLUGIN_DIR/"
          fi
          ls "$GST_PLUGIN_DIR/" | head -5

          # ffmpeg (static build from BtbN/FFmpeg-Builds)
          curl -fsSL "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" \
            -o ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz
          mv ffmpeg-master-latest-linux64-gpl/bin/ffmpeg "$SIDECAR_DIR/ffmpeg"
          chmod +x "$SIDECAR_DIR/ffmpeg"

          # whisper-cli (build from source — fast, ~30s)
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp.git whisper-src
          cmake -B whisper-src/build -DCMAKE_BUILD_TYPE=Release -S whisper-src
          cmake --build whisper-src/build --config Release -j
          cp whisper-src/build/bin/whisper-cli "$SIDECAR_DIR/whisper-cli"

          mkdir -p "$SIDECAR_DIR/gst-plugins"
          touch "$SIDECAR_DIR/gst-plugins/.gst-stub"
          # Placeholder for ytdlp-python (needed by resources config on all OS;
          # Linux creates the real thing, macOS/Windows get the stub)
          mkdir -p "$SIDECAR_DIR/ytdlp-python"
          touch "$SIDECAR_DIR/ytdlp-python/.python-stub"

          ls -lh "$SIDECAR_DIR/"

      - name: Download sidecars (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $dir = "$env:SIDECAR_DIR"
          New-Item -ItemType Directory -Force -Path $dir

          # yt-dlp.exe
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" `
            -OutFile "$dir/yt-dlp.exe"
          # Tauri resources checks literal paths — also provide without .exe
          Copy-Item "$dir/yt-dlp.exe" "$dir/yt-dlp"

          # ffmpeg.exe (essentials build from gyan.dev)
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" `
            -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          Copy-Item (Get-ChildItem ffmpeg-tmp/ffmpeg-*/bin/ffmpeg.exe).FullName `
            "$dir/ffmpeg.exe"

          # whisper-cli.exe (build from source)
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp.git whisper-src
          cmake -B whisper-src/build -DCMAKE_BUILD_TYPE=Release -S whisper-src
          cmake --build whisper-src/build --config Release -j
          Copy-Item whisper-src/build/bin/Release/whisper-cli.exe `
            "$dir/whisper-cli.exe"

          # Placeholder for gst-plugins dir (needed by resources config on all OS)
          New-Item -ItemType Directory -Force -Path "$dir/gst-plugins" | Out-Null
          Set-Content -Path "$dir/gst-plugins/.gst-stub" -Value ""
          # Placeholder for ytdlp-python dir (needed by resources config on all OS)
          New-Item -ItemType Directory -Force -Path "$dir/ytdlp-python" | Out-Null
          Set-Content -Path "$dir/ytdlp-python/.python-stub" -Value ""

          Get-ChildItem $dir

      - name: Download sidecars (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p "$SIDECAR_DIR"

          # yt-dlp
          curl -fsSL "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos" \
            -o "$SIDECAR_DIR/yt-dlp"
          chmod +x "$SIDECAR_DIR/yt-dlp"

          # ffmpeg (static build from evermeet)
          curl -fsSL "https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip" -o ffmpeg.zip
          unzip -o ffmpeg.zip -d ffmpeg-tmp
          mv ffmpeg-tmp/ffmpeg "$SIDECAR_DIR/ffmpeg"
          chmod +x "$SIDECAR_DIR/ffmpeg"

          # whisper-cli (build from source)
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp.git whisper-src
          cmake -B whisper-src/build -DCMAKE_BUILD_TYPE=Release -S whisper-src
          cmake --build whisper-src/build --config Release -j
          cp whisper-src/build/bin/whisper-cli "$SIDECAR_DIR/whisper-cli"

          mkdir -p "$SIDECAR_DIR/gst-plugins"
          touch "$SIDECAR_DIR/gst-plugins/.gst-stub"
          # Placeholder for ytdlp-python (needed by resources config on all OS;
          # Linux creates the real thing, macOS/Windows get the stub)
          mkdir -p "$SIDECAR_DIR/ytdlp-python"
          touch "$SIDECAR_DIR/ytdlp-python/.python-stub"

          ls -lh "$SIDECAR_DIR/"

      # ── Build + release ───────────────────────────────────────────────
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev \
            librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            ca-certificates python3 python3-pip python3-venv \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav \
            libgstreamer-plugins-base1.0-0 libgstreamer-plugins-good1.0-0

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          tagName: v${{ inputs.version }}
          releaseName: 'BetterClipper v${{ inputs.version }}'
          releaseBody: |
            ## BetterClipper v${{ inputs.version }}

            ### Linux
            - `BetterClipper_${{ inputs.version }}_amd64.deb` — Ubuntu 24.04+, Debian 13+
            - `BetterClipper_${{ inputs.version }}_amd64.AppImage` — any Linux (self-contained)
            - `BetterClipper-${{ inputs.version }}-1.x86_64.rpm` — Fedora 39+, openSUSE Tumbleweed

            ### Windows
            - `.msi` installer
            - `.exe` installer (NSIS)

            ### macOS
            - `.dmg` disk image

            Requires `yt-dlp`, `ffmpeg`, and `whisper-cli` — bundled in the AppImage, included as sidecars on Windows/macOS.
          releaseDraft: false
          prerelease: false
